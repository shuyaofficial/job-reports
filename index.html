<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>定期ジョブの成果</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* 1列の読み物。画像を大きく見せ、文字は1項目2行だけ */
:root{
  --bg:#f5f6fa; --surface:#ffffff; --ink:#1b1f2b; --ink-2:#5b6274; --line:#e2e5ee;
  --accent:#6a3fd6; --accent-soft:#efe9fc; --on:#ffffff;
  --ok:#1e7a4c; --ok-soft:#e1f3e8; --wait:#8f5300; --wait-soft:#fcefd9; --no:#646a7a; --no-soft:#eceef3;
  --head:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161d; --surface:#1d2029; --ink:#eef0f6; --ink-2:#a8afc0; --line:#2f3442;
  --accent:#b39bff; --accent-soft:#2a2342; --on:#14161d;
  --ok:#7fd6a5; --ok-soft:#1b2e25; --wait:#f2b866; --wait-soft:#34281a; --no:#a3a9b8; --no-soft:#262a34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161d; --surface:#1d2029; --ink:#eef0f6; --ink-2:#a8afc0; --line:#2f3442;
  --accent:#b39bff; --accent-soft:#2a2342; --on:#14161d;
  --ok:#7fd6a5; --ok-soft:#1b2e25; --wait:#f2b866; --wait-soft:#34281a; --no:#a3a9b8; --no-soft:#262a34; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75}
.page{max-width:880px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--head);font-weight:800;text-wrap:balance;line-height:1.35;margin:0}
h1{font-size:34px}
.sub{color:var(--ink-2);margin:6px 0 0}
.part{display:flex;align-items:baseline;gap:12px;margin:44px 0 14px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.part .no{font-family:var(--head);font-size:15px;font-weight:800;color:var(--on);background:var(--accent);border-radius:999px;padding:2px 12px;white-space:nowrap}
.part h2{font-size:24px}
.items,.facts{display:grid;gap:18px}
.item,.fact{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item img,.fact img{display:block;width:100%;height:auto}
.item img.half{max-width:560px;margin:0 auto}
.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;background:#000}
.pair img{display:block;width:100%;height:auto;min-width:0}
.pair .arr{color:#c9b8ff;font-size:24px;font-weight:800;padding:0 2px}
.item .txt{padding:12px 16px 14px;display:grid;gap:4px;min-width:0}
.fact .txt{padding:14px 16px}
.item h3,.fact h3{font-size:19px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fact h3{margin-bottom:6px}
.item h3 a{font-family:var(--body);font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:0 10px}
.item h3 a:hover,.item h3 a:focus-visible{background:var(--accent-soft)}
.row{display:grid;grid-template-columns:5.5em 1fr;gap:8px;align-items:baseline}
.row b{font-size:13px;color:var(--ink-2);font-weight:700;letter-spacing:.04em}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-wait{background:var(--wait-soft);color:var(--wait)} .c-no{background:var(--no-soft);color:var(--no)}
.fact ul{margin:0;padding-left:1.2em}.fact li{margin:3px 0}
/* 比較表: 行＝見る点、列＝候補。勝った列に .win を付ける */
.cmpwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.cmp{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:14px 12px;text-align:center;border-bottom:1px dashed var(--line);vertical-align:middle}
.cmp thead th{font-size:14px;font-weight:700;color:var(--ink)}
.cmp tbody th{text-align:left;font-size:14px;font-weight:700;white-space:nowrap}
.cmp tbody th small{display:block;font-size:11px;font-weight:400;color:var(--ink-2)}
.cmp td{font-size:18px}
.cmp.two{min-width:0}
@media (max-width:600px){.cmp.two th,.cmp.two td{padding:10px 6px}.cmp.two td{font-size:15px}.cmp.two tbody th{white-space:normal}}
.cmp .win{background:var(--accent-soft);font-weight:800}
.cmp thead .win{color:var(--accent)}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:0}
.steps{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:8px}
.steps.three{grid-template-columns:1fr auto 1fr auto 1fr}
.step{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);min-width:0}
.step b{display:block;font-family:var(--head);font-size:17px}
.step span{color:var(--ink-2);font-size:14px}
.step.go{border-color:var(--accent);background:var(--accent-soft)}
.arrow{font-size:22px;color:var(--accent);font-weight:800}
.foot{margin-top:36px;color:var(--ink-2);font-size:13px}
.foot a{color:var(--accent)}
@media (max-width:600px){
  h1{font-size:27px}
  .row{grid-template-columns:1fr;gap:0}
  .pair{grid-template-columns:1fr}.pair .arr{transform:rotate(90deg);justify-self:center;line-height:1}
  .steps,.steps.three{grid-template-columns:1fr}.arrow{transform:rotate(90deg);justify-self:center}
}

.meta{color:var(--ink-2);font-size:13px;margin:0 0 8px}
.fact p{margin:0 0 8px}
.idx{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.idx li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.idx li:last-child{border-bottom:0}
.idx a{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="page">
<h1>定期ジョブの成果</h1>
<p class="sub">公開済みの早わかりです。</p>

<div class="facts" style="margin-top:24px">
<section class="fact"><div class="txt"><h3>論文分析</h3>
<ul class="idx">
<li><a href="ronbun/2026-11-11/">2026-11-11</a><span class="chip c-ok">公開済み</span></li>
</ul></div></section>
</div>
</div>
</body>
</html>
